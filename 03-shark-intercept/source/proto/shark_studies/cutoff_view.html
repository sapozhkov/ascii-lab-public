<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shark intercept · swimming model</title>
<style>
:root {
  color-scheme: dark;
  background: #080d14;
  color: #f3f4ef;
  font: 1rem/1.5 system-ui, sans-serif;
  --muted: #a8b5c5;
  --edge: #2c3b4a;
  --accent: #ffad76;
}

* { box-sizing: border-box; }
body { margin: 0; }
a { color: #c4e7e7; text-underline-offset: .25em; }
a:hover { color: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }

.shell { max-width: 60rem; margin: auto; padding: clamp(1rem, 4vw, 3.5rem); }
.masthead { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: .5rem 1.5rem; }
.masthead nav { display: flex; gap: 1rem; }
h1, h2, .number { font-family: ui-monospace, "Courier New", monospace; }
h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); font-weight: 650; line-height: 1.15; }
h2 { margin: 0; font-size: clamp(1.05rem, 2.5vw, 1.45rem); line-height: 1.25; }
.intro { margin: 1rem 0 1.75rem; color: var(--muted); }
.gallery-page h1 { font-size: clamp(1.875rem, 4vw, 2.75rem); }
.gallery { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(.75rem, 2vw, 1.25rem); }
@media (min-width: 36rem) { .gallery { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 52rem) { .gallery { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { display: block; height: 100%; border: 1px solid var(--edge); background: #101923; color: inherit; text-decoration: none; }
.tile:hover { border-color: var(--accent); }
img { display: block; height: auto; width: 100%; }
.tile img { aspect-ratio: 1; object-fit: cover; object-position: center 22%; border-bottom: 1px solid var(--edge); }
.caption { padding: .65rem .75rem; }
.caption h2 { font-size: clamp(.95rem, 1.8vw, 1.1rem); }
.caption p { margin: .35rem 0 0; color: var(--muted); font-size: .875rem; }
.number { display: block; margin-bottom: .35rem; color: var(--accent); font-size: .875rem; }

.back { display: inline-block; margin-bottom: 1.5rem; }
.scene { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: clamp(1rem, 4vw, 3rem); }
.scene > img { border: 1px solid var(--edge); }
.scene-copy { align-self: center; }
.scene--source .scene-copy { align-self: start; min-width: 0; }
.scene-copy h1 { font-size: clamp(1.75rem, 5vw, 3rem); }
.actions { display: flex; flex-wrap: wrap; gap: .75rem 1.25rem; margin: 1.25rem 0; }
.scene-cards { display: grid; grid-auto-rows: 1fr; gap: 1rem; }
.scene-card { display: block; color: inherit; border: 1px solid var(--edge); background: #101923; text-decoration: none; }
.scene-card--model { display: flex; flex-direction: column; }
.model-preview { position: relative; flex: 1 0 3rem; overflow: hidden; }
.model-preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--model-preview-position, center 95%); }
.scene-card:hover { color: inherit; border-color: var(--accent); }
.scene-card-header { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: .35rem 1rem; padding: .75rem 1rem; border-bottom: 1px solid var(--edge); font-size: .95rem; }
.scene-card-header strong { color: var(--accent); text-decoration: underline; text-underline-offset: .25em; }
.filename, .scene-card pre { font-family: ui-monospace, "Courier New", monospace; }
.scene-card pre { margin: 0; padding: .75rem 1rem; font-size: .875rem; white-space: pre-wrap; overflow-wrap: anywhere; }
.model-caption { display: block; padding: .65rem 1rem; color: var(--muted); font-size: .875rem; }
@media (max-width: 40rem) {
  .scene { grid-template-columns: 1fr; }
  .scene > img { max-width: 18rem; }
  .scene-copy { grid-row: 1; }
}

.model-playback {
  position: sticky;
  top: 0;
  z-index: 5;
  margin: 0 0 1rem;
  padding: .65rem .85rem;
  background: #101923;
  border: 1px solid var(--edge);
}
.model-transport { display: flex; align-items: center; gap: .75rem; }
.model-playback [data-model-play] {
  min-width: 5rem;
  padding: .35rem .7rem;
  background: var(--accent);
  border: 1px solid var(--accent);
  border-radius: .25rem;
  color: #151a23;
  font: inherit;
  font-weight: 650;
  cursor: pointer;
}
.model-playback [data-model-play]:disabled { opacity: .6; cursor: default; }
.model-playback [data-model-time] { font-variant-numeric: tabular-nums; }
.model-playback [data-model-slider] {
  display: block;
  width: 100%;
  margin: .5rem 0 .15rem;
  accent-color: var(--accent);
}
.model-playback :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.model-playback [data-model-status] { margin: .5rem 0 0; color: var(--muted); }
</style>
<style>
*{box-sizing:border-box}body{margin:0;background:#08151a;color:#d2e3e3;font:16px system-ui,sans-serif}
main{max-width:950px;margin:auto;padding:18px}h1{font-size:22px;margin:0 0 12px}
.views{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
video,canvas{width:100%;display:block;background:#0a2029}figure{margin:0}figcaption,p{margin:8px 0}
input{accent-color:#8ed7d3}
@media(max-width:550px){main{padding:8px}.views{gap:5px}h1{font-size:18px}}
</style>
</head><body>
<main>

<h1>Shark intercept · swimming model</h1>
<section class="model-playback" aria-label="Playback">
  <div class="model-transport">
    <button data-model-play type="button">Play</button>
    <output data-model-time for="model-timeline">0.00 s</output>
  </div>
  <input data-model-slider id="model-timeline" type="range" min="0" step="1" value="0" aria-label="Scene timeline">
  <p data-model-status role="status" hidden></p>
</section>

<div class="views"><figure><figcaption>ASCII</figcaption><video src="cutoff.mp4" loop playsinline muted preload="metadata" aria-label="ASCII shark intercept reel"></video></figure>
<figure><figcaption>Overhead view</figcaption><canvas width="540" height="648" aria-label="Overhead diagram of the shark and fish"></canvas>
<p><label><input type="checkbox" id="mark"> Track the fish that breaks away</label></p>
<p id="stage"></p></figure></div>
</main>
<script>function createModelPlayer({ fps, frameCount, draw, video }) {
  const play = document.querySelector('[data-model-play]');
  const slider = document.querySelector('[data-model-slider]');
  const time = document.querySelector('[data-model-time]');
  const status = document.querySelector('[data-model-status]');
  const duration = frameCount / fps;
  const clampFrame = frame => Math.max(0, Math.min(frameCount - 1, frame));
  const frameAt = seconds => Math.floor(seconds * fps + 0.0001);
  slider.max = frameCount - 1;

  let seconds = 0;
  let frame = 0;
  let animation = null;

  function show(nextSeconds, nextFrame) {
    seconds = nextSeconds;
    frame = nextFrame;
    slider.value = String(frame);
    time.textContent = seconds.toFixed(2) + ' s';
    slider.setAttribute('aria-valuetext', seconds.toFixed(2) + ' seconds');
    draw(seconds, frame);
  }

  function showVideoFrame(nextFrame) {
    nextFrame = clampFrame(nextFrame);
    if (nextFrame !== frame) show(nextFrame / fps, nextFrame);
  }

  function stopAnimation() {
    if (animation !== null) cancelAnimationFrame(animation);
    animation = null;
    play.textContent = 'Play';
  }

  function seekVideo() {
    // Seek just inside the frame, away from the boundary between two frames.
    if (video.readyState >= 1) video.currentTime = (frame + 0.15) / fps;
  }

  function seek(nextFrame) {
    nextFrame = clampFrame(Math.round(nextFrame));
    if (video) video.pause();
    else stopAnimation();
    show(nextFrame / fps, nextFrame);
    if (video) seekVideo();
  }

  function report(message) {
    status.textContent = message;
    status.hidden = false;
  }

  function bindVideo() {
    video.loop = true;
    const ready = () => {
      play.disabled = false;
      if (frame !== 0) seekVideo();
    };
    const failed = () => {
      stopAnimation();
      play.disabled = true;
      report('The ASCII clip could not load. You can still scrub the model.');
    };
    play.disabled = true;
    video.addEventListener('loadedmetadata', ready);
    video.addEventListener('error', failed);
    video.addEventListener('play', () => { play.textContent = 'Pause'; });
    video.addEventListener('pause', stopAnimation);
    play.addEventListener('click', async () => {
      if (play.disabled) return;
      if (!video.paused) {
        video.pause();
        return;
      }
      try {
        await video.play();
        status.hidden = true;
      } catch {
        report('Playback could not start. Try Play again or use the timeline.');
      }
    });

    if (video.requestVideoFrameCallback) {
      const present = (_now, { mediaTime }) => {
        if (!video.seeking && !video.paused) showVideoFrame(Math.round(mediaTime * fps));
        video.requestVideoFrameCallback(present);
      };
      video.requestVideoFrameCallback(present);
    } else {
      const tick = () => {
        if (!video.seeking) showVideoFrame(frameAt(video.currentTime));
        animation = requestAnimationFrame(tick);
      };
      video.addEventListener('play', () => { animation = requestAnimationFrame(tick); });
    }
    if (video.readyState >= 1) ready();
    if (video.error) failed();
  }

  function bindSimulation() {
    let started;
    let origin;
    const tick = now => {
      const elapsed = (origin + Math.max(0, now - started) / 1000) % duration;
      show(elapsed, clampFrame(frameAt(elapsed)));
      animation = requestAnimationFrame(tick);
    };
    play.addEventListener('click', () => {
      if (animation !== null) {
        stopAnimation();
        return;
      }
      origin = seconds;
      started = performance.now();
      play.textContent = 'Pause';
      animation = requestAnimationFrame(tick);
    });
  }

  slider.addEventListener('input', () => seek(Number(slider.value)));
  show(0, 0);
  if (video) bindVideo();
  else bindSimulation();

  return { seek, redraw: () => draw(seconds, frame) };
}
</script>
<script>
const frames=__FRAMES__, fps=__FPS__;
const video=document.querySelector('video'), canvas=document.querySelector('canvas'), ctx=canvas.getContext('2d');
const mark=document.querySelector('#mark'), target=frames.find(f=>f.target!==null).target;
function line(points,color,width){
 ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();
 points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
}
function draw(i){
 const f=frames[i];ctx.setTransform(6,0,0,6,0,0);ctx.fillStyle='#0a2029';ctx.fillRect(0,0,90,108);
 ctx.strokeStyle='#14333b';ctx.lineWidth=.13;ctx.beginPath();
 for(let n=0;n<108;n+=10){ctx.moveTo(0,n);ctx.lineTo(90,n);ctx.moveTo(n,0);ctx.lineTo(n,108)}ctx.stroke();
 f.fish.forEach(([x,y],j)=>{
   if(f.caught&&j===target)return;
   const prev=frames[Math.max(0,i-4)];
   const tail=prev.fish[j];
   if(tail && Math.hypot(x-tail[0],y-tail[1])<5)line([tail,[x,y]],'#5b858b',.35);
   ctx.fillStyle='#d1ebe7';ctx.beginPath();ctx.arc(x,y,.38,0,2*Math.PI);ctx.fill();
 });
 line(f.spine,'#709aa6',.9);f.spine.filter((p,j)=>j%3===0).forEach(([x,y])=>{
   ctx.fillStyle='#bbd5d0';ctx.beginPath();ctx.arc(x,y,.4,0,7);ctx.fill()
 });
 if(mark.checked&&!f.caught){
   line(frames.slice(Math.max(0,i-fps),i+1).filter(s=>!s.caught).map(s=>s.fish[target]),'#f6b77b',.35);
   ctx.strokeStyle='#ffd59c';ctx.lineWidth=.3;ctx.beginPath();ctx.arc(...f.fish[target],1.65,0,2*Math.PI);ctx.stroke();
 }
 const stage=document.querySelector('#stage');
 stage.textContent=f.stage;
 if(f.swim){
   const [speed,thrust,drag,sweep,bank]=f.swim;
   stage.textContent+=` · Speed ${speed.toFixed(2)} · Tail sweep ${sweep.toFixed(2)} · Thrust ${thrust.toFixed(2)} · Drag ${drag.toFixed(2)}`;
   if(bank!==undefined)stage.textContent+=` · Roll ${bank.toFixed(1)}°`;
 }
}
const player=createModelPlayer({ fps, frameCount: frames.length, video, draw: (_seconds, frame) => draw(frame) });
mark.addEventListener('change', player.redraw);
</script></body></html>
